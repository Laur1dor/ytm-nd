services:
  ytm-sync:
    build: .
    image: ytm-sync:latest
    container_name: ytm-sync
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    # Используем DNS хоста через встроенный резолвер Docker. Публичные
    # 8.8.8.8/8.8.4.4 могут блокироваться или подменяться провайдером.
    environment:
      PLAYLIST_URL: ${PLAYLIST_URL:?Set PLAYLIST_URL in .env}
      YT_API_KEY: ${YT_API_KEY:-}                    # ключ YouTube Data API (надёжнее cookies)
      LIKES_TO_MAIN: ${LIKES_TO_MAIN:-false}         # копировать новые лайки в Main перед скачиванием
      YTM_OAUTH_CLIENT_ID: ${YTM_OAUTH_CLIENT_ID:-}
      YTM_OAUTH_CLIENT_SECRET: ${YTM_OAUTH_CLIENT_SECRET:-}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-14400}   # каждые 4 часа
      MUSIC_SUBDIR: ${MUSIC_SUBDIR:-YouTube Music}
      MUSIC_ROOT: /music
      # Клиент YouTube для скачивания. android_vr больше не работает: с 08.2026 YouTube
      # требует GVS PO Token, а bgutil выдаёт токены только веб-семейству клиентов.
      # tv_simply/mweb + POT_BASE_URL отдают opus 251. Список = порядок перебора.
      YT_PLAYER_CLIENT: ${YT_PLAYER_CLIENT:-tv_simply,mweb}
      CONFIG_DIR: /config
      # один альбom в Navidrome (чтобы не плодились сотни одиночных альбомов)
      ALBUM_NAME: ${ALBUM_NAME:-YTM}
      ALBUM_ARTIST: ${ALBUM_ARTIST:-YouTube Music}
      # хранилище: REQUIRE_SHARE=true — гард «только на сетевую шару».
      # Для локального диска/иного хранилища поставь false и подмонтируй нужную папку в /music.
      REQUIRE_SHARE: ${REQUIRE_SHARE:-true}
      # опциональное зеркало в S3/удалённое хранилище (rclone remote, напр. "s3:bucket/music").
      # Пусто = выключено. Конфиг rclone клади в ./data/rclone.conf.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      # PO-Token провайдер: YouTube требует GVS PO Token для аудио-дорожек (иначе 403).
      # Пусто = выключено. Имя хоста = имя соседнего сервиса в этом compose.
      POT_BASE_URL: ${POT_BASE_URL:-http://bgutil-provider:4416}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      # rslave: контейнер видит перемонтирование шары на хосте без ребута контейнера
      - type: bind
        source: ${MUSIC_HOST_PATH:-/mnt/Music}
        target: /music
        bind:
          propagation: rslave
      - ./data:/config             # archive.txt, idmap.tsv, cookies.txt, replacements.tsv
      - ./sync.py:/sync.py:ro      # скрипт правится без пересборки образа
      - ./likes_to_main.py:/likes_to_main.py:ro
      - ./entrypoint.sh:/entrypoint.sh:ro

  # Выдаёт yt-dlp GVS PO Token (крутит JS-челлендж YouTube в headless-движке).
  # Наружу не публикуется — доступен только контейнерам этого compose.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    # Тот же DNS хоста, что и у основного сервиса.
    environment:
      TZ: ${TZ:-Europe/Moscow}
